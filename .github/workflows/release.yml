# Builds the AppImage and publishes a GitHub release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# or run it by hand from the Actions tab (it then builds for an existing tag, or makes a
# draft release for the commit you pick).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0). Created on the chosen commit if it doesn't exist."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write            # to create the release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Tag '$TAG' isn't like v1.2.3"; exit 1; }

      # Electron, Python and appimagetool are downloaded (and checksum-verified) by the build
      # scripts; cache the unpacked runtimes so a release doesn't fetch ~150 MB every time
      # (setup.sh skips the download when runtime/ already holds the pinned versions).
      - name: Cache runtimes
        uses: actions/cache@v4
        with:
          path: |
            runtime/electron
            runtime/python
            build/appimagetool-*
          key: runtimes-${{ hashFiles('setup.sh', 'build-appimage.sh') }}

      - name: Build the AppImage
        env:
          HEROIC_RATINGS_VERSION: ${{ env.TAG }}
        run: ./build-appimage.sh

      - name: Name it after the version
        run: |
          OUT="HeroicRatings-$TAG-x86_64.AppImage"
          mv dist/HeroicRatings-x86_64.AppImage "dist/$OUT"
          (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Smoke test (the AppImage unpacks and its Python backend imports)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/dist/$OUT" --appimage-extract >/dev/null
          squashfs-root/runtime/python/bin/python3 -c "import sys; sys.path.insert(0, 'squashfs-root'); import heroic_ratings; print('backend OK')"
          test -x squashfs-root/runtime/electron/electron

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$OUT" "dist/$OUT.sha256" --clobber
          else
            gh release create "$TAG" "dist/$OUT" "dist/$OUT.sha256" \
              --target "$GITHUB_SHA" --title "Heroic Ratings $TAG" --generate-notes \
              ${{ github.event_name == 'workflow_dispatch' && '--draft' || '' }}
          fi
